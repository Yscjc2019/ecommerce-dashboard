name: Milk Price 3-Hour Watchdog

on:
  schedule:
    # 每隔 3 小时自动运行一次
    - cron: '0 */3 * * *'
  # 仅在定时到达或手动点击 Run workflow 时运行（推送代码时不误触发）
  workflow_dispatch:

jobs:
  check-milk-price:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取最新仓库数据库
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 运行云端采价巡检与邮件提醒
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASS: ${{ secrets.SENDER_PASS }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python milk_cloud_watchdog.py
